<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABS Capital</title>
<meta name="description" content="ABS Capital, from McGill Athletes in Business. Coming soon.">
<link rel="icon" type="image/png" href="assets/capital/favicon-capital.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#192849;      /* matches the logo background exactly */
  --navy-deep:#111C34;
  --white:#FFFFFF;
  --soft:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.22);
  --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit}
a:focus-visible{outline:2px solid var(--white);outline-offset:4px;border-radius:999px}

.top{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(16px,4vw,40px)}
.top a{font-size:.9rem;text-decoration:none;color:var(--soft);display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;transition:color .2s,border-color .2s,background .2s}
.top a:hover{color:var(--navy);background:var(--white);border-color:var(--white)}
.top .from{font-family:var(--serif);font-weight:700;letter-spacing:.3em;font-size:.78rem;color:var(--soft);text-transform:uppercase}

main{flex:1;display:grid;place-items:center;padding:24px 16px 48px;text-align:center}
.wrap{display:grid;justify-items:center;gap:36px;max-width:640px}
.logo{width:min(350px,72vw);height:auto;display:block;animation:rise 1.1s ease both}
.soon{display:grid;gap:14px;justify-items:center;animation:rise 1.1s .25s ease both}
.rule{width:56px;height:1px;background:var(--line)}
.soon h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.soon p{margin:0;color:var(--soft);font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo,.soon{animation:none}}

@media (max-width:520px){.top .from{display:none}}
footer{padding:20px;text-align:center;font-size:.82rem;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
  <header class="top">
    <a href="index.html" aria-label="Back to McGill Athletes in Business"><span aria-hidden="true">←</span> Back to ABS</a>
    <span class="from">McGill Athletes in Business</span>
  </header>

  <main>
    <div class="wrap">
      <img class="logo" src="assets/capital/abs-capital-stacked.png" alt="ABS Capital" width="554" height="334">
      <div class="soon">
        <span class="rule" aria-hidden="true"></span>
        <h1>Coming soon</h1>
      </div>
    </div>
  </main>

  <footer>© 2026 McGill Athletes in Business</footer>
</body>
</html>
